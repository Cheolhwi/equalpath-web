<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1600 900" preserveAspectRatio="xMinYMin meet">
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#30382f" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#7b896b"/></marker></defs><rect width="100%" height="100%" fill="#fbfaf5"/><text x="800" y="42" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="24px" font-weight="700" fill="#ffffff" text-anchor="middle">EqualPath · Search + Personalised Recommendation Framework (Epic 6)</text><rect x="20" y="16" width="1560" height="48" rx="14" fill="#30382f"/><text x="800" y="47" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="22px" font-weight="700" fill="#ffffff" text-anchor="middle">EqualPath · Search + Personalised Recommendation Framework (Epic 6)</text><rect x="20" y="76" width="1560" height="32" rx="10" fill="#f0f3e9" stroke="#d6d9cc"/><text x="800" y="98" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="14px" font-weight="400" fill="#596451" text-anchor="middle">Principle: search conditions decide usability; recommendation only reranks eligible results. Reviews are not live availability.</text><rect x="20" y="130" width="360" height="34" rx="10" fill="#dfe8d6" stroke="#a3b18d" stroke-width="1.5"/><text x="34" y="153" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="15px" font-weight="700" fill="#30382f" text-anchor="start">1. INPUT SIGNALS</text><rect x="400" y="130" width="370" height="34" rx="10" fill="#dfe8d6" stroke="#a3b18d" stroke-width="1.5"/><text x="414" y="153" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="15px" font-weight="700" fill="#30382f" text-anchor="start">2. EVIDENCE + HARD GATES</text><rect x="790" y="130" width="380" height="34" rx="10" fill="#e7e2cc" stroke="#b4a56b" stroke-width="1.5"/><text x="804" y="153" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="15px" font-weight="700" fill="#30382f" text-anchor="start">3. PERSONALISED RERANK</text><rect x="1190" y="130" width="390" height="34" rx="10" fill="#e7e2cc" stroke="#b4a56b" stroke-width="1.5"/><text x="1204" y="153" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="15px" font-weight="700" fill="#30382f" text-anchor="start">4. OUTPUT + LEARNING</text><rect x="35" y="180" width="330" height="105" rx="14" fill="#ffffff" stroke="#9daa8d" stroke-width="2" filter="url(#shadow)"/><text x="51" y="207" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="16px" font-weight="700" fill="#30382f" text-anchor="start">Current search request</text><text x="51" y="233" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">care type · location / radius · date</text><text x="51" y="253" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">start / end · age · pickup · sort</text><rect x="35" y="305" width="330" height="100" rx="14" fill="#ffffff" stroke="#9daa8d" stroke-width="2" filter="url(#shadow)"/><text x="51" y="332" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="16px" font-weight="700" fill="#30382f" text-anchor="start">First-use preferences</text><text x="51" y="358" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">Skippable; choose up to 3 review-derived preferences</text><text x="51" y="378" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">Examples: smooth pickup, clear fees, responsive team</text><rect x="35" y="425" width="330" height="105" rx="14" fill="#ffffff" stroke="#9daa8d" stroke-width="2" filter="url(#shadow)"/><text x="51" y="452" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="16px" font-weight="700" fill="#30382f" text-anchor="start">Browser-local behaviour</text><text x="51" y="478" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">saved · compare · viewed · hide</text><text x="51" y="498" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">Time-decayed and isolated by care type</text><rect x="35" y="550" width="330" height="120" rx="14" fill="#ffffff" stroke="#9daa8d" stroke-width="2" filter="url(#shadow)"/><text x="51" y="577" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="16px" font-weight="700" fill="#30382f" text-anchor="start">Branch-level review evidence</text><text x="51" y="603" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">Source, branch identity, retrieval time</text><text x="51" y="623" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">Review text / topics → automatic classification</text><text x="51" y="643" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">Overall stars never become preferences</text><rect x="420" y="180" width="330" height="120" rx="14" fill="#ffffff" stroke="#9daa8d" stroke-width="2" filter="url(#shadow)"/><text x="436" y="207" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="16px" font-weight="700" fill="#30382f" text-anchor="start">Review classifier</text><text x="436" y="233" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">Level 1: temporary care / pickup</text><text x="436" y="253" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">Late collection / fees / communication</text><text x="436" y="273" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">Level 2: specific preference labels</text><rect x="420" y="325" width="330" height="100" rx="14" fill="#ffffff" stroke="#9daa8d" stroke-width="2" filter="url(#shadow)"/><text x="436" y="352" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="16px" font-weight="700" fill="#30382f" text-anchor="start">Evidence gate</text><text x="436" y="378" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">At least 2 supporting reviews for the same branch and topic</text><text x="436" y="398" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">Below threshold → unknown; listing / one review is not enough</text><rect x="420" y="450" width="330" height="125" rx="14" fill="#ffffff" stroke="#9daa8d" stroke-width="2" filter="url(#shadow)"/><text x="436" y="477" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="16px" font-weight="700" fill="#30382f" text-anchor="start">Current search hard gates</text><text x="436" y="503" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">care type · radius · location · age</text><text x="436" y="523" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">date · start / end · pickup</text><text x="436" y="543" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">Conflict: grey / does not match; unknown: keep and explain</text><rect x="420" y="600" width="330" height="85" rx="14" fill="#f8eee7" stroke="#a36a55" stroke-width="2" filter="url(#shadow)"/><text x="436" y="627" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="16px" font-weight="700" fill="#30382f" text-anchor="start">Weekend rule</text><text x="436" y="653" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">Saturday / Sunday care end = Not listed</text><text x="436" y="673" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">→ conflict (not usable), not unknown</text><rect x="810" y="180" width="340" height="115" rx="14" fill="#fffdf8" stroke="#b4a56b" stroke-width="2" filter="url(#shadow)"/><text x="826" y="207" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="16px" font-weight="700" fill="#30382f" text-anchor="start">Combine personalisation signals</text><text x="826" y="233" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">Selected preferences · review support</text><text x="826" y="253" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">saved / compared / viewed history</text><text x="826" y="273" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">Provider similarity (meaningful facts only)</text><rect x="810" y="320" width="340" height="120" rx="14" fill="#fffdf8" stroke="#b4a56b" stroke-width="2" filter="url(#shadow)"/><text x="826" y="347" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="16px" font-weight="700" fill="#30382f" text-anchor="start">Lightweight capped score</text><text x="826" y="373" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">base: distance + known condition fit</text><text x="826" y="393" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">personalisation: history / similarity</text><text x="826" y="413" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">preference nudge ≤ 0.22; unknown adds no score</text><rect x="810" y="465" width="340" height="120" rx="14" fill="#fffdf8" stroke="#b4a56b" stroke-width="2" filter="url(#shadow)"/><text x="826" y="492" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="16px" font-weight="700" fill="#30382f" text-anchor="start">Rerank eligible results only</text><text x="826" y="518" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">Keep explicit sort: price / closing / pickup</text><text x="826" y="538" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">known conflicts last</text><text x="826" y="558" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">contact priority is internal only</text><rect x="810" y="610" width="340" height="75" rx="14" fill="#f0f3e9" stroke="#a3b18d" stroke-width="2" filter="url(#shadow)"/><text x="826" y="637" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="16px" font-weight="700" fill="#30382f" text-anchor="start">Cold start</text><text x="826" y="663" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">No preferences / history: distance + known fit</text><text x="826" y="683" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">First-use preference page supplies the first signal; skip / edit anytime</text><rect x="1210" y="180" width="340" height="115" rx="14" fill="#ffffff" stroke="#9daa8d" stroke-width="2" filter="url(#shadow)"/><text x="1226" y="207" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="16px" font-weight="700" fill="#30382f" text-anchor="start">Normal search results</text><text x="1226" y="233" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">Map / cards / list use the same rerank</text><text x="1226" y="253" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">“Matches what you value: …”</text><text x="1226" y="273" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">Never show a single childcare score</text><rect x="1210" y="320" width="340" height="115" rx="14" fill="#ffffff" stroke="#9daa8d" stroke-width="2" filter="url(#shadow)"/><text x="1226" y="347" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="16px" font-weight="700" fill="#30382f" text-anchor="start">Details explanation</text><text x="1226" y="373" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">Four key facts + condition checks</text><text x="1226" y="393" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">Show review preference source and support</text><text x="1226" y="413" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">Explain unknown and conflict separately</text><rect x="1210" y="460" width="340" height="105" rx="14" fill="#f8eee7" stroke="#a36a55" stroke-width="2" filter="url(#shadow)"/><text x="1226" y="487" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="16px" font-weight="700" fill="#30382f" text-anchor="start">No-match only when all are grey</text><text x="1226" y="513" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">Suggest external short-care websites</text><text x="1226" y="533" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">Hide when any usable / to-confirm centre exists</text><rect x="1210" y="590" width="340" height="95" rx="14" fill="#f0f3e9" stroke="#a3b18d" stroke-width="2" filter="url(#shadow)"/><text x="1226" y="617" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="16px" font-weight="700" fill="#30382f" text-anchor="start">Feedback loop</text><text x="1226" y="643" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">save / compare / view / hide</text><text x="1226" y="663" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">→ local history → rerank next search</text><text x="1226" y="683" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="13px" font-weight="400" fill="#596451" text-anchor="start">30-day decay; clear cache → landing</text><path d="M365,232 C392,232 392,505 420,505" fill="none" stroke="#7b896b" stroke-width="2.4"  marker-end="url(#arrow)"/><text x="364" y="363" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="11px" font-weight="400" fill="#596451" text-anchor="start">hard gate</text><path d="M365,355 C587,355 587,235 810,235" fill="none" stroke="#7b896b" stroke-width="2.4"  marker-end="url(#arrow)"/><text x="559" y="290" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="11px" font-weight="400" fill="#596451" text-anchor="start">cold start</text><path d="M365,477 C587,477 587,235 810,235" fill="none" stroke="#7b896b" stroke-width="2.4"  marker-end="url(#arrow)"/><text x="559" y="351" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="11px" font-weight="400" fill="#596451" text-anchor="start">decayed behaviour</text><path d="M365,610 C392,610 392,240 420,240" fill="none" stroke="#7b896b" stroke-width="2.4"  marker-end="url(#arrow)"/><text x="364" y="420" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="11px" font-weight="400" fill="#596451" text-anchor="start">classify</text><path d="M750,240 C585,240 585,375 420,375" fill="none" stroke="#7b896b" stroke-width="2.4"  marker-end="url(#arrow)"/><text x="557" y="302" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="11px" font-weight="400" fill="#596451" text-anchor="start">level 1 → 2</text><path d="M750,375 C780,375 780,238 810,238" fill="none" stroke="#7b896b" stroke-width="2.4"  marker-end="url(#arrow)"/><text x="752" y="301" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="11px" font-weight="400" fill="#596451" text-anchor="start">supported / unknown</text><path d="M750,510 C780,510 780,378 810,378" fill="none" stroke="#7b896b" stroke-width="2.4"  marker-end="url(#arrow)"/><text x="752" y="439" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="11px" font-weight="400" fill="#596451" text-anchor="start">eligible pool</text><path d="M585,600 C585,600 585,575 585,575" fill="none" stroke="#7b896b" stroke-width="2.4"  marker-end="url(#arrow)"/><text x="557" y="582" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="11px" font-weight="400" fill="#596451" text-anchor="start">override</text><path d="M1150,238 C1180,238 1180,235 1210,235" fill="none" stroke="#7b896b" stroke-width="2.4"  marker-end="url(#arrow)"/><text x="1152" y="231" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="11px" font-weight="400" fill="#596451" text-anchor="start">feature vector</text><path d="M1150,380 C1180,380 1180,235 1210,235" fill="none" stroke="#7b896b" stroke-width="2.4"  marker-end="url(#arrow)"/><text x="1152" y="302" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="11px" font-weight="400" fill="#596451" text-anchor="start">score</text><path d="M1150,525 C1180,525 1180,378 1210,378" fill="none" stroke="#7b896b" stroke-width="2.4"  marker-end="url(#arrow)"/><text x="1152" y="446" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="11px" font-weight="400" fill="#596451" text-anchor="start">ordered output</text><path d="M750,510 C980,510 980,510 1210,510" fill="none" stroke="#7b896b" stroke-width="2.4"  marker-end="url(#arrow)"/><text x="952" y="505" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="11px" font-weight="400" fill="#596451" text-anchor="start">all grey only</text><path d="M1380,295 C1380,295 1380,590 1380,590" fill="none" stroke="#7b896b" stroke-width="2.4"  marker-end="url(#arrow)"/><text x="1352" y="437" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="11px" font-weight="400" fill="#596451" text-anchor="start">actions</text><path d="M1380,435 C1380,435 1380,590 1380,590" fill="none" stroke="#7b896b" stroke-width="2.4"  marker-end="url(#arrow)"/><text x="1352" y="507" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="11px" font-weight="400" fill="#596451" text-anchor="start">actions</text><path d="M1210,638 C1180,638 1180,648 1150,648" fill="none" stroke="#7b896b" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="1152" y="638" font-family="PingFang SC,Helvetica,Arial,sans-serif" font-size="11px" font-weight="400" fill="#596451" text-anchor="start">update local profile</text></svg>