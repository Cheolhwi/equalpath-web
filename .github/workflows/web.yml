name: Test and verify Appwrite website

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, build and verify release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run release
      - name: Verify the matching Appwrite release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SITE_URL: https://equalpathcare.me/
        run: node scripts/verify-site.mjs
